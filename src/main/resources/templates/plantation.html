<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>GreenLog - Plantations</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f8f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2e7d32;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background-color: #2e7d32;
        }

        button:hover {
            background-color: #1b5e20;
        }

        .edit-btn {
            background-color: #1976d2;
        }

        .edit-btn:hover {
            background-color: #0d47a1;
        }

        .delete-btn {
            background-color: #d32f2f;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        .cancel-btn {
            background-color: #757575;
        }

        .cancel-btn:hover {
            background-color: #424242;
        }

        .back-btn {
            background-color: #455a64;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2e7d32;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        #editBox {
            display: none;
        }

        .info {
            background-color: #e8f5e9;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>


<header>

    <h1>GreenLog - Plantations</h1>

    <p>Manage Planted Trees</p>

</header>



<div class="container">


    <!-- ADD PLANTATION -->

    <div class="box">

        <h2>Add Plantation</h2>


        <div class="info">

            Enter your own IDs for Plantation,
            Drive and Volunteer.

        </div>


        <input
                type="number"
                id="id"
                placeholder="Plantation ID"
        >


        <input
                type="text"
                id="species"
                placeholder="Tree Species"
        >


        <input
                type="text"
                id="location"
                placeholder="Location"
        >


        <input
                type="date"
                id="datePlanted"
        >


        <input
                type="date"
                id="nextCheckInDate"
        >


        <input
                type="number"
                id="driveId"
                placeholder="Drive ID"
        >


        <input
                type="number"
                id="volunteerId"
                placeholder="Volunteer ID"
        >


        <br>


        <button onclick="addPlantation()">
            Add Plantation
        </button>

    </div>



    <!-- EDIT PLANTATION -->

    <div class="box" id="editBox">

        <h2>Edit Plantation</h2>


        <input
                type="number"
                id="editId"
                placeholder="Plantation ID"
                readonly
        >


        <input
                type="text"
                id="editSpecies"
                placeholder="Tree Species"
        >


        <input
                type="text"
                id="editLocation"
                placeholder="Location"
        >


        <input
                type="date"
                id="editDatePlanted"
        >


        <input
                type="date"
                id="editNextCheckInDate"
        >


        <input
                type="number"
                id="editDriveId"
                placeholder="Drive ID"
        >


        <input
                type="number"
                id="editVolunteerId"
                placeholder="Volunteer ID"
        >


        <br>


        <button onclick="updatePlantation()">
            Update Plantation
        </button>


        <button
                class="cancel-btn"
                onclick="cancelEdit()"
        >
            Cancel
        </button>

    </div>



    <!-- PLANTATION LIST -->

    <div class="box">

        <h2>Plantation List</h2>


        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Species</th>

                <th>Location</th>

                <th>Date Planted</th>

                <th>Next Check-in</th>

                <th>Drive ID</th>

                <th>Volunteer ID</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="plantationTable">

            </tbody>

        </table>

    </div>



    <!-- DUE CHECK-INS -->

    <div class="box">

        <h2>Due Check-ins</h2>


        <table>

            <thead>

            <tr>

                <th>Plantation ID</th>

                <th>Species</th>

                <th>Location</th>

                <th>Next Check-in Date</th>

            </tr>

            </thead>


            <tbody id="dueTable">

            </tbody>

        </table>

    </div>



    <!-- BACK -->

    <div class="box">

        <button
                class="back-btn"
                onclick="window.location.href='/dashboard'"
        >
            Back to Dashboard
        </button>

    </div>


</div>



<script>


    /* =========================
       ADD PLANTATION
       ========================= */

    function addPlantation() {


        let id =
            document.getElementById("id").value;


        let species =
            document.getElementById("species").value;


        let location =
            document.getElementById("location").value;


        let datePlanted =
            document.getElementById("datePlanted").value;


        let nextCheckInDate =
            document.getElementById(
                "nextCheckInDate"
            ).value;


        let driveId =
            document.getElementById("driveId").value;


        let volunteerId =
            document.getElementById("volunteerId").value;


        if (
            id === "" ||
            species === "" ||
            location === "" ||
            datePlanted === "" ||
            nextCheckInDate === "" ||
            driveId === "" ||
            volunteerId === ""
        ) {

            alert("Please fill all fields.");

            return;

        }


        let plantation = {

            id: parseInt(id),

            species: species,

            location: location,

            datePlanted: datePlanted,

            nextCheckInDate: nextCheckInDate,

            drive: {

                id: parseInt(driveId)

            },

            volunteer: {

                id: parseInt(volunteerId)

            }

        };


        fetch('/Plantation', {

            method: 'POST',

            headers: {

                'Content-Type':
                    'application/json'

            },

            body:
                JSON.stringify(plantation)

        })


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to add plantation"
                );

            }

            return response.text();

        })


        .then(message => {

            alert(message);


            document.getElementById("id").value = "";

            document.getElementById("species").value = "";

            document.getElementById("location").value = "";

            document.getElementById("datePlanted").value = "";

            document.getElementById("nextCheckInDate").value = "";

            document.getElementById("driveId").value = "";

            document.getElementById("volunteerId").value = "";


            loadPlantations();

        })


        .catch(error => {

            console.log(error);

            alert(
                "Error adding plantation. " +
                "Check that the Drive ID and Volunteer ID exist."
            );

        });

    }



    /* =========================
       LOAD PLANTATIONS
       ========================= */

    function loadPlantations() {


        fetch('/Plantation')


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load plantations"
                );

            }

            return response.json();

        })


        .then(plantations => {


            let table =
                document.getElementById(
                    "plantationTable"
                );


            table.innerHTML = "";


            plantations.forEach(plantation => {


                let driveId = "";

                let volunteerId = "";


                if (plantation.drive) {

                    driveId =
                        plantation.drive.id;

                }


                if (plantation.volunteer) {

                    volunteerId =
                        plantation.volunteer.id;

                }


                let row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${plantation.id}
                    </td>

                    <td>
                        ${plantation.species}
                    </td>

                    <td>
                        ${plantation.location}
                    </td>

                    <td>
                        ${plantation.datePlanted}
                    </td>

                    <td>
                        ${plantation.nextCheckInDate}
                    </td>

                    <td>
                        ${driveId}
                    </td>

                    <td>
                        ${volunteerId}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editPlantation(${plantation.id})"
                        >
                            Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deletePlantation(${plantation.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;


                table.appendChild(row);

            });


            loadDueCheckIns(plantations);

        })


        .catch(error => {

            console.log(error);

            alert("Error loading plantations.");

        });

    }



    /* =========================
       EDIT PLANTATION
       ========================= */

    function editPlantation(id) {


        fetch('/Plantation/' + id)


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Plantation not found"
                );

            }

            return response.json();

        })


        .then(plantation => {


            document.getElementById(
                "editId"
            ).value = plantation.id;


            document.getElementById(
                "editSpecies"
            ).value = plantation.species;


            document.getElementById(
                "editLocation"
            ).value = plantation.location;


            document.getElementById(
                "editDatePlanted"
            ).value = plantation.datePlanted;


            document.getElementById(
                "editNextCheckInDate"
            ).value =
                plantation.nextCheckInDate;


            if (plantation.drive) {

                document.getElementById(
                    "editDriveId"
                ).value =
                    plantation.drive.id;

            } else {

                document.getElementById(
                    "editDriveId"
                ).value = "";

            }


            if (plantation.volunteer) {

                document.getElementById(
                    "editVolunteerId"
                ).value =
                    plantation.volunteer.id;

            } else {

                document.getElementById(
                    "editVolunteerId"
                ).value = "";

            }


            document.getElementById(
                "editBox"
            ).style.display = "block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        })


        .catch(error => {

            console.log(error);

            alert("Error loading plantation.");

        });

    }



    /* =========================
       UPDATE PLANTATION
       ========================= */

    function updatePlantation() {


        let id =
            document.getElementById(
                "editId"
            ).value;


        let species =
            document.getElementById(
                "editSpecies"
            ).value;


        let location =
            document.getElementById(
                "editLocation"
            ).value;


        let datePlanted =
            document.getElementById(
                "editDatePlanted"
            ).value;


        let nextCheckInDate =
            document.getElementById(
                "editNextCheckInDate"
            ).value;


        let driveId =
            document.getElementById(
                "editDriveId"
            ).value;


        let volunteerId =
            document.getElementById(
                "editVolunteerId"
            ).value;


        if (
            id === "" ||
            species === "" ||
            location === "" ||
            datePlanted === "" ||
            nextCheckInDate === "" ||
            driveId === "" ||
            volunteerId === ""
        ) {

            alert("Please fill all fields.");

            return;

        }


        let plantation = {

            id: parseInt(id),

            species: species,

            location: location,

            datePlanted: datePlanted,

            nextCheckInDate: nextCheckInDate,

            drive: {

                id: parseInt(driveId)

            },

            volunteer: {

                id: parseInt(volunteerId)

            }

        };


        fetch('/Plantation', {

            method: 'PUT',

            headers: {

                'Content-Type':
                    'application/json'

            },

            body:
                JSON.stringify(plantation)

        })


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to update plantation"
                );

            }

            return response.text();

        })


        .then(message => {

            alert(message);

            cancelEdit();

            loadPlantations();

        })


        .catch(error => {

            console.log(error);

            alert(
                "Error updating plantation."
            );

        });

    }



    /* =========================
       CANCEL EDIT
       ========================= */

    function cancelEdit() {


        document.getElementById(
            "editId"
        ).value = "";


        document.getElementById(
            "editSpecies"
        ).value = "";


        document.getElementById(
            "editLocation"
        ).value = "";


        document.getElementById(
            "editDatePlanted"
        ).value = "";


        document.getElementById(
            "editNextCheckInDate"
        ).value = "";


        document.getElementById(
            "editDriveId"
        ).value = "";


        document.getElementById(
            "editVolunteerId"
        ).value = "";


        document.getElementById(
            "editBox"
        ).style.display = "none";

    }



    /* =========================
       DELETE PLANTATION
       ========================= */

    function deletePlantation(id) {


        let confirmDelete =
            confirm(
                "Are you sure you want to delete Plantation ID " +
                id +
                "?"
            );


        if (!confirmDelete) {

            return;

        }


        fetch('/Plantation/' + id, {

            method: 'DELETE'

        })


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to delete plantation"
                );

            }

            return response.text();

        })


        .then(message => {

            alert(message);

            loadPlantations();

        })


        .catch(error => {

            console.log(error);

            alert(
                "Error deleting plantation."
            );

        });

    }



    /* =========================
       DUE CHECK-INS
       ========================= */

    function loadDueCheckIns(plantations) {


        let table =
            document.getElementById(
                "dueTable"
            );


        table.innerHTML = "";


        let today =
            new Date()
                .toISOString()
                .split("T")[0];


        plantations.forEach(plantation => {


            if (
                plantation.nextCheckInDate &&
                plantation.nextCheckInDate <= today
            ) {


                let row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${plantation.id}
                    </td>

                    <td>
                        ${plantation.species}
                    </td>

                    <td>
                        ${plantation.location}
                    </td>

                    <td>
                        ${plantation.nextCheckInDate}
                    </td>

                `;


                table.appendChild(row);

            }

        });

    }



    /* =========================
       PAGE LOAD
       ========================= */

    window.onload = function() {

        loadPlantations();

    };


</script>


</body>

</html>
