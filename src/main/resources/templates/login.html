<!DOCTYPE html>
<html>
<head>
    <title>GreenLog Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
            text-align: center;
        }

        h1 {
            color: #2e7d32;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 95%;
            padding: 10px;
            background-color: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>GreenLog</h1>

    <p>Tree Plantation Drive Tracker</p>

    <form action="/dashboard" method="get">

        <input type="text" name="username"
               placeholder="Username" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
